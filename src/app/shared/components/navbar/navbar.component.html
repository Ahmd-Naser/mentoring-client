<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/dashboard" class="logo">Mentoring</a>
    </div>

    <ul class="nav-links">
      <li>
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Dashboard
        </a>
      </li>
      <li>
        <a routerLink="/groups" routerLinkActive="active">
          Groups
        </a>
      </li>
      <li>
        <a routerLink="/problems" routerLinkActive="active">
          Problems
        </a>
      </li>
    </ul>

    <div class="nav-user">
      @if (currentUser(); as user) {
        <div class="user-info">
          <a routerLink="/profile" class="user-name-link" title="Manage Profile">
            👤 {{ user.firstName }} {{ user.lastName }}
          </a>
          <button class="btn-logout" (click)="onLogout()">Logout</button>
        </div>
      }
    </div>
  </div>
</nav>
